name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, sqlite3, zip, gd, exif
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate composer
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --compact
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array

# Deploy otomatis ke VPS upstream (dikasir.web.id) dihapus di fork ini.
# Aplikasi koperasi berjalan lokal dan diakses online lewat Cloudflare Tunnel
# (lihat docs/deploy-lokal-cloudflare-tunnel.md).
